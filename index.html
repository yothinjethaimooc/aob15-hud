      background: var(--card, #111827);
      color: var(--foreground, #f8fafc);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.08s ease, background 0.15s ease;

    .btn:active { transform: scale(0.97); }
    .btn-primary { background: #2563eb; border-color: #2563eb; color: #ffffff; }
    .btn-active-green { background: #059669; border-color: #059669; color: #ffffff; }
    .btn-active-amber { background: #d97706; border-color: #d97706; color: #ffffff; }

    .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }

      background: var(--card, #111827);
      border: 1px solid var(--border, rgba(148,163,184,0.22));
      border-radius: 14px;
      padding: 12px;
    }
    .status-bar {
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border, rgba(148,163,184,0.22));
      background: var(--card, #111827);
      color: var(--muted-foreground, #94a3b8);

      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .action-card {
      border-radius: 16px;
      border: 2px solid #3b82f6;
      background: var(--card, #111827);
      overflow: hidden;
    }

      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: #ffffff;

    .gear-name { font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }

    .action-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .stat-box {
      background: rgba(148,163,184,0.08);
      border: 1px solid var(--border, rgba(148,163,184,0.18));
      border-radius: 10px;
      padding: 8px;
      text-align: center;

    .stat-lbl { font-size: 12px; color: var(--muted-foreground, #94a3b8); }
    .stat-val { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 2px; }
    .next-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 11px;
      border-radius: 10px;
      background: rgba(148,163,184,0.10);
      font-size: 13px;

      color: var(--muted-foreground, #94a3b8);

      padding-top: 8px;

      flex: 1;
      text-align: center;
      padding: 7px 10px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--border, rgba(148,163,184,0.22));
      background: transparent;
      color: var(--muted-foreground, #94a3b8);

    .tab-btn.active {
      background: var(--foreground, #f8fafc);
      color: var(--background, #0b1120);
      border-color: transparent;

    .chip-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
    .chip {
      white-space: nowrap;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--border, rgba(148,163,184,0.24));
      background: transparent;
      color: var(--foreground, #f8fafc);
      cursor: pointer;
    }

      font-size: 12px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.45);
      color: var(--foreground, #f8fafc);
      display: none;
    }
    .mode-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--muted-foreground, #94a3b8);
    }
    .mode-pill {

      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid var(--border, rgba(148,163,184,0.28));
      background: var(--card, #111827);
      color: var(--muted-foreground, #94a3b8);
      cursor: pointer;

      background: #0284c7;
      border-color: #0284c7;
      color: #ffffff;

    function haversineM(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const toRad = d => d * Math.PI / 180;
      const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // Snap GPS (lat, lon) onto embedded GPX segments
    function snapToTrack(lat, lon, forceGlobal) {
      const cosLat = Math.cos(lat * Math.PI / 180);
      const mPerLat = 110540;
      const mPerLon = 111320 * cosLat;

      function searchRange(minKm, maxKm) {
        let bestDist = Infinity, bestKm = currentKm;
        for (let i = 0; i < TRACK.length - 1; i++) {
          const p0 = TRACK[i], p1 = TRACK[i + 1];
          if (p1[3] < minKm || p0[3] > maxKm) continue;
          const ax = (p0[1] - lon) * mPerLon, ay = (p0[0] - lat) * mPerLat;
          const bx = (p1[1] - lon) * mPerLon, by = (p1[0] - lat) * mPerLat;
          const vx = bx - ax, vy = by - ay;
          const len2 = vx * vx + vy * vy;
          let t = len2 > 0 ? (-(ax * vx + ay * vy) / len2) : 0;
          t = Math.max(0, Math.min(1, t));
          const px = ax + t * vx, py = ay + t * vy;
          const d = Math.hypot(px, py);
          if (d < bestDist) {
            bestDist = d;
            bestKm = p0[3] + t * (p1[3] - p0[3]);
          }
        }
        return { dist: bestDist, km: bestKm };
      }

      if (!forceGlobal && hasGpsLock) {
        const local = searchRange(Math.max(0, currentKm - 0.8), Math.min(MAX_KM, currentKm + 2.0));
        if (local.dist <= 90) return local;
      }
      return searchRange(0, MAX_KM);
    }

    function interpAtKm(km) {
      if (km <= 0) return TRACK[0];
      if (km >= MAX_KM) return TRACK[TRACK.length - 1];
      for (let i = 1; i < TRACK.length; i++) {
        if (TRACK[i][3] >= km) {
          const a = TRACK[i - 1], b = TRACK[i];
          const t = (km - a[3]) / (b[3] - a[3] || 1);
          return [a[0] + t*(b[0]-a[0]), a[1] + t*(b[1]-a[1]), a[2] + t*(b[2]-a[2]), km];
        }
      }
      return TRACK[TRACK.length - 1];
    }

    function calcGainLoss(kmStart, kmEnd) {
      let gain = 0, loss = 0;
      let prevEle = interpAtKm(kmStart)[2];
      for (const p of TRACK) {
        if (p[3] > kmStart && p[3] < kmEnd) {
          const diff = p[2] - prevEle;
          if (diff > 0) gain += diff; else loss -= diff;
          prevEle = p[2];
        }
      }
      const endEle = interpAtKm(kmEnd)[2];
      if (endEle > prevEle) gain += (endEle - prevEle); else loss += (prevEle - endEle);
      return { gain: Math.round(gain), loss: Math.round(loss) };
    }

      const strong = light ? '#0f172a' : '#f8fafc';
      const W = 640, H = 190, PAD = { l: 34, r: 10, t: 22, b: 22 };
      const CW = W - PAD.l - PAD.r, CH = H - PAD.t - PAD.b;
      const xOf = km => PAD.l + (km / MAX_KM) * CW;
      const yOf = ele => PAD.t + CH - (ele / 270) * CH;

      let h = '';
      for (const e of [0, 100, 200]) {
        const y = yOf(e);
        h += `<line x1="${PAD.l}" y1="${y}" x2="${W-PAD.r}" y2="${y}" stroke="${grid}" stroke-width="1" />`;
        h += `<text x="${PAD.l-5}" y="${y+4}" text-anchor="end" fill="${muted}" font-size="12">${e}m</text>`;
      }
      for (let k = 0; k <= 14; k += 2) {
        h += `<text x="${xOf(k)}" y="${H-5}" text-anchor="middle" fill="${muted}" font-size="12">${k}k</text>`;
      }

      // Draw colored segments
      const baseY = yOf(0);
      for (const seg of SEGMENTS) {
        const pts = [[seg.s, interpAtKm(seg.s)[2]]];
        for (const p of TRACK) if (p[3] > seg.s && p[3] < seg.e) pts.push([p[3], p[2]]);

        const dTop = pts.map((p, i) => `${i===0?'M':'L'}${xOf(p[0]).toFixed(1)},${yOf(p[1]).toFixed(1)}`).join(' ');

        h += `<path d="${dTop}" fill="none" stroke="${col}" stroke-width="2.2" />`;

      // Upcoming 1.2 km lookahead band
      const xNow = xOf(currentKm);
      const xAhead = xOf(Math.min(MAX_KM, currentKm + 1.2));
      h += `<rect x="${xNow}" y="${PAD.t}" width="${Math.max(2, xAhead - xNow)}" height="${CH}" fill="#38bdf8" fill-opacity="0.12" />`;

      // Key labels
      for (const p of [{k:5.27,e:75,t:'CP1'},{k:6.23,e:247,t:'247m'},{k:9.06,e:95,t:'CP5'},{k:13.28,e:62,t:'100%'}]) {
        h += `<text x="${xOf(p.k)}" y="${yOf(p.e)-7}" text-anchor="middle" fill="${strong}" font-size="12" font-weight="700">${p.t}</text>`;
      }

      // Live runner dot
      const curPt = interpAtKm(currentKm);
      const cx = xOf(currentKm), cy = yOf(curPt[2]);
      h += `<line x1="${cx}" y1="${PAD.t}" x2="${cx}" y2="${baseY}" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,2" />`;
      h += `<circle cx="${cx}" cy="${cy}" r="7" fill="#38bdf8" fill-opacity="0.35" class="pulse-ring" />`;
      h += `<circle cx="${cx}" cy="${cy}" r="5" fill="#0ea5e9" stroke="#ffffff" stroke-width="2" />`;

      svg.innerHTML = h;
    }

    function renderMap() {
      if (viewTab === 'ele') return;
      const svg = document.getElementById('map-svg');
      const light = isLight();
      const muted = light ? '#475569' : '#94a3b8';
      const strong = light ? '#0f172a' : '#f8fafc';

      const cur = interpAtKm(currentKm);
      const W = 640, H = 310;
      const cosLat = Math.cos(12.482 * Math.PI / 180);

      let minLat = 12.4705, maxLat = 12.4962, minLon = 99.9352, maxLon = 99.9668;
      if (zoomMap) {
        const spanLat = 0.0065; // ~720m radius
        const spanLon = spanLat / cosLat;
        minLat = cur[0] - spanLat; maxLat = cur[0] + spanLat;
        minLon = cur[1] - spanLon; maxLon = cur[1] + spanLon;
      }

      const dLonM = (maxLon - minLon) * cosLat;
      const dLatM = (maxLat - minLat);
      const pad = 20;
      const scale = Math.min((W - 2*pad) / dLonM, (H - 2*pad) / dLatM);
      const offX = (W - dLonM * scale) / 2;
      const offY = (H - dLatM * scale) / 2;

      const mx = lon => offX + (lon - minLon) * cosLat * scale;
      const my = lat => H - (offY + (lat - minLat) * scale);

      let h = '';
      // Draw track colored by segment
      for (const seg of SEGMENTS) {
        const pts = TRACK.filter(p => p[3] >= seg.s - 0.04 && p[3] <= seg.e + 0.04);
        if (pts.length < 2) continue;
        const d = pts.map((p, i) => `${i===0?'M':'L'}${mx(p[1]).toFixed(1)},${my(p[0]).toFixed(1)}`).join(' ');
        h += `<path d="${d}" fill="none" stroke="${MODES[seg.mode].color}" stroke-width="${zoomMap ? 4.5 : 3.2}" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.88" />`;
      }

      // Draw CP1, CP5, Start/Finish, FULL100
      const pins = [
        { k: 0.0, t: 'Start/Finish', c: '#f8fafc' },
        { k: 5.27, t: 'CP1', c: '#38bdf8' },
        { k: 6.23, t: 'สูงสุด', c: '#f97316' },
        { k: 8.28, t: 'ยอด2(85%)', c: '#8b5cf6' },
        { k: 9.06, t: 'CP5', c: '#38bdf8' },
        { k: 11.94, t: 'ยอดท้าย', c: '#ec4899' },
        { k: 13.28, t: 'FULL100', c: '#ec4899' }
      ];
      for (const pin of pins) {
        const pt = interpAtKm(pin.k);
        const x = mx(pt[1]), y = my(pt[0]);
        if (x < -10 || x > W+10 || y < -10 || y > H+10) continue;
        h += `<circle cx="${x}" cy="${y}" r="4.5" fill="${pin.c}" stroke="#0f172a" stroke-width="1.5" />`;
        h += `<text x="${x+7}" y="${y+4}" fill="${strong}" font-size="12" font-weight="700" stroke="${light?'#fff':'#0b1120'}" stroke-width="3" paint-order="stroke">${pin.t}</text>`;
      }

      // Snapped runner dot on route
      const rx = mx(cur[1]), ry = my(cur[0]);
      h += `<circle cx="${rx}" cy="${ry}" r="8" fill="#38bdf8" fill-opacity="0.35" class="pulse-ring" />`;
      h += `<circle cx="${rx}" cy="${ry}" r="5.5" fill="#0ea5e9" stroke="#ffffff" stroke-width="2" />`;

      // Raw GPS coordinate dot if active
      if (rawLat !== null && rawLon !== null) {
        const gx = mx(rawLon), gy = my(rawLat);
        h += `<line x1="${gx}" y1="${gy}" x2="${rx}" y2="${ry}" stroke="#94a3b8" stroke-dasharray="2,2" stroke-width="1.2" />`;
        h += `<circle cx="${gx}" cy="${gy}" r="4" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />`;
      }

      svg.innerHTML = h;
    }

    // GPS Control (1-Tap Battery Saver, Interval Polling, Optional Live)
    function modeLabel(m) {
      if (m === '30s') return 'ทุก 30 วิ';
      if (m === '15s') return 'ทุก 15 วิ';
      if (m === 'live') return 'สด 1 วิ';
      return 'เช็ก 1 ที';
    }

    function formatAge(ms) {
      const s = Math.max(0, Math.round(ms / 1000));
      if (s < 60) return `${s} วิก่อน`;
      const m = Math.floor(s / 60);
      return `${m} นาที ${s % 60} วิก่อน`;
    }

    function formatClock(ts) {
      const d = new Date(ts);
      const pad = n => String(n).padStart(2, '0');
      return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    function updateGpsButtons() {
      const btn = document.getElementById('gps-btn');
      const refBtn = document.getElementById('refresh-now-btn');
      if (gpsMode === '1tap') {
        btn.textContent = gpsFetching ? '⏳ กำลังจับพิกัด...' : '📍 เช็กพิกัด 1 ที';
        btn.className = gpsFetching ? 'btn btn-active-amber' : 'btn btn-primary';
        refBtn.style.display = 'none';
      } else if (gpsActive) {
        btn.textContent = `⏹ หยุด GPS (${modeLabel(gpsMode)})`;
        btn.className = 'btn btn-active-green';
        refBtn.style.display = (gpsMode === '30s' || gpsMode === '15s') ? 'inline-flex' : 'none';
      } else {
        btn.textContent = `📡 เปิด GPS (${modeLabel(gpsMode)})`;
        btn.className = 'btn btn-primary';
        refBtn.style.display = 'none';
      }
    }

    function updateGpsStatusText() {
      if (simTimer) return;
      const left = document.getElementById('status-left');
      const ageTxt = lastFixTs ? formatAge(Date.now() - lastFixTs) : '';
      const clkTxt = lastFixTs ? formatClock(lastFixTs) : '';
      const accTxt = gpsAcc !== null ? ` (±${gpsAcc} ม.)` : '';

      if (gpsMode === '1tap') {
        if (gpsFetching) {
          left.textContent = 'กำลังจับพิกัด GPS 1 ครั้ง...';
        } else if (lastFixTs) {
          left.textContent = `GPS พักแล้ว • เช็กล่าสุด ${clkTxt}${accTxt}`;
        } else {
          left.textContent = 'โหมดประหยัดแบต: กด "เช็กพิกัด 1 ที" หรือเลื่อน กม. ด้านล่าง';
        }
        return;
      }

      if (!gpsActive) {
        left.textContent = lastFixTs
          ? `ปิด GPS แล้ว • ล่าสุด ${clkTxt}${accTxt}`
          : `โหมด ${modeLabel(gpsMode)}: กด "เปิด GPS" เพื่อเริ่ม`;
        return;
      }

      if (gpsMode === 'live') {
        left.textContent = lastFixTs
          ? `GPS สด 1 วิ${accTxt} • อัปเดต ${ageTxt}`
          : 'กำลังค้นหาสัญญาณ GPS สด...';
        return;
      }

      const remSec = nextPollTs ? Math.max(0, Math.ceil((nextPollTs - Date.now()) / 1000)) : 0;
      if (gpsFetching) {
        left.textContent = lastFixTs
          ? `กำลังอัปเดต GPS... (ล่าสุด ${ageTxt})`
          : `กำลังค้นหาสัญญาณ GPS (${modeLabel(gpsMode)})...`;
      } else if (lastFixTs) {
        left.textContent = `GPS ${modeLabel(gpsMode)}${accTxt} • ล่าสุด ${ageTxt} • รอบหน้า ${remSec} วิ`;
      } else {
        left.textContent = `GPS ${modeLabel(gpsMode)} • รอบหน้า ${remSec} วิ`;
      }
    }

    function applyGpsPosition(pos) {
      gpsFetching = false;
      rawLat = pos.coords.latitude;
      rawLon = pos.coords.longitude;
      gpsAcc = Math.round(pos.coords.accuracy || 0);
      lastFixTs = Date.now();
      const snap = snapToTrack(rawLat, rawLon, !hasGpsLock);
      hasGpsLock = true;
      currentKm = snap.km;
      offRouteM = Math.round(snap.dist);

      const offTxt = offRouteM > 40 ? `⚠️ นอกเส้นทาง ${offRouteM} ม.` : `บนเส้นทาง ✓ (±${offRouteM} ม.)`;
      document.getElementById('resnap-btn').style.display = 'inline-flex';
      document.getElementById('status-right').textContent = offTxt;
      document.getElementById('status-right').style.color = offRouteM > 40 ? '#ef4444' : '#10b981';
      updateGpsButtons();
      updateGpsStatusText();
      renderHUD();
    }

    function handleGpsError(err) {
      gpsFetching = false;
      let msg = 'รับสัญญาณ GPS ไม่ได้: ';
      if (err.code === 1) msg += 'ไม่ได้รับอนุญาต Location หรือเปิดจาก file:// ที่เบราว์เซอร์บล็อก — ใช้แถบเลื่อน กม. แทนได้ทันที';
      else if (err.code === 2) msg += 'ไม่พบสัญญาณดาวเทียม (ลองออกที่โล่ง)';
      else msg += 'หมดเวลาค้นหาสัญญาณ';
      showWarn(msg);
      updateGpsButtons();
      updateGpsStatusText();
    }

    function checkGpsPreconditions() {
      if (!navigator.geolocation) {
        showWarn('เบราว์เซอร์นี้ไม่รองรับ GPS — สามารถเลื่อนแถบ กม. ด้านล่างเพื่อดูรายละเอียดแต่ละช่วงได้ตามปกติครับ');
        return false;
      }
      if (location.protocol === 'file:' || location.protocol === 'content:') {
        showWarn('⚠️ เปิดจากไฟล์ในเครื่องตรง ๆ (file://) มือถือส่วนใหญ่จะบล็อก GPS — ถ้าต้องการใช้ GPS จริงแบบออฟไลน์ ให้นำไฟล์นี้ขึ้นเว็บ HTTPS (เช่น GitHub Pages) แล้วกด "Add to Home Screen" ครับ');
      } else {
        showWarn(null);
      }
      return true;
    }

    function clearGpsTimers() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      if (gpsPollTimer) {
        clearInterval(gpsPollTimer);
        gpsPollTimer = null;
      }
      if (gpsTickTimer) {
        clearInterval(gpsTickTimer);
        gpsTickTimer = null;
      }
      nextPollTs = null;
    }

    function stopGPS() {
      gpsActive = false;
      gpsFetching = false;
      clearGpsTimers();
      updateGpsButtons();
      updateGpsStatusText();
    }

    function fetchSingleFix() {
      if (!checkGpsPreconditions()) return;
      if (gpsFetching) return;
      stopSim();
      gpsFetching = true;
      updateGpsButtons();
      updateGpsStatusText();
      navigator.geolocation.getCurrentPosition(
        applyGpsPosition,
        handleGpsError,
        { enableHighAccuracy: true, maximumAge: gpsMode === '1tap' ? 5000 : 2000, timeout: 10000 }
      );
    }

    function startGpsSchedule() {
      clearGpsTimers();
      if (!gpsActive) return;

      if (gpsMode === 'live') {
        gpsFetching = true;
        updateGpsStatusText();
        watchId = navigator.geolocation.watchPosition(
          applyGpsPosition,
          handleGpsError,
          { enableHighAccuracy: true, maximumAge: 2500, timeout: 12000 }
        );
        gpsTickTimer = setInterval(updateGpsStatusText, 1000);
        return;
      }

      const intervalMs = gpsMode === '15s' ? 15000 : 30000;
      const runPoll = () => {
        nextPollTs = Date.now() + intervalMs;
        fetchSingleFix();
      };
      runPoll();
      gpsPollTimer = setInterval(runPoll, intervalMs);
      gpsTickTimer = setInterval(updateGpsStatusText, 1000);
    }

    function toggleGPS() {
      if (gpsMode === '1tap') {
        fetchSingleFix();
        return;
      }
      if (gpsActive) {
        stopGPS();
        return;
      }
      if (!checkGpsPreconditions()) return;
      stopSim();
      gpsActive = true;
      updateGpsButtons();
      startGpsSchedule();
    }

    function setGpsMode(newMode) {
      gpsMode = newMode;
      document.querySelectorAll('.mode-pill').forEach(p => {
        p.classList.toggle('active', p.dataset.gpsmode === newMode);
      });
      if (newMode === '1tap') {
        stopGPS();
        return;
      }
      if (gpsActive) {
        startGpsSchedule();
      }
      updateGpsButtons();
      updateGpsStatusText();
    }

    document.addEventListener('visibilitychange', () => {
      if (!gpsActive) return;
      if (document.hidden) {
        // Save battery while phone screen is locked or app is backgrounded
        clearGpsTimers();
      } else {
        startGpsSchedule();
      }
    });

    async function toggleWakeLock() {
      const btn = document.getElementById('wake-btn');
      if (wakeLock) {
        await wakeLock.release();
        wakeLock = null;
        btn.textContent = '☀️ จอค้าง: ปิด';
        btn.className = 'btn btn-sm';
        return;
      }
      if (!('wakeLock' in navigator)) {
        showWarn('เบราว์เซอร์นี้ไม่รองรับคำสั่ง Wake Lock (ตั้งค่า Display Auto-Lock ในมือถือแทนได้ครับ)');
        return;
      }
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        btn.textContent = '☀️ จอค้าง: เปิด';
        btn.className = 'btn btn-sm btn-active-amber';
        wakeLock.addEventListener('release', () => {
          wakeLock = null;
          btn.textContent = '☀️ จอค้าง: ปิด';
          btn.className = 'btn btn-sm';
        });
      } catch (e) {
        showWarn('ไม่สามารถล็อกหน้าจอค้างได้ในโหมดนี้');
      }
    }

    function stopSim() {
      if (simTimer) {
        clearInterval(simTimer);
        simTimer = null;
        const btn = document.getElementById('sim-btn');
        btn.textContent = '▶ จำลอง';
        btn.className = 'btn btn-sm';
      }
    }

    function toggleSim() {
      const btn = document.getElementById('sim-btn');
      if (simTimer) { stopSim(); updateGpsStatusText(); return; }
      if (gpsActive) stopGPS();
      btn.textContent = '⏸ หยุดจำลอง';
      btn.className = 'btn btn-sm btn-active-pink';
      document.getElementById('status-left').textContent = 'โหมดจำลองเส้นทาง 0 -> 14.54 กม.';
      simTimer = setInterval(() => {
        currentKm = currentKm + 0.08;
        if (currentKm > MAX_KM) currentKm = 0.0;
        document.getElementById('status-right').textContent = `${Math.round(currentKm / MAX_KM * 100)}%`;
        renderHUD();
      }, 250);
    }

    // Event bindings
    document.getElementById('gps-btn').onclick = toggleGPS;
    document.getElementById('refresh-now-btn').onclick = () => {
      if (gpsMode === '30s' || gpsMode === '15s') {
        const intervalMs = gpsMode === '15s' ? 15000 : 30000;
        nextPollTs = Date.now() + intervalMs;
        fetchSingleFix();
      }
    };
    document.querySelectorAll('.mode-pill').forEach(btn => {
      btn.onclick = () => setGpsMode(btn.dataset.gpsmode);
    });
    document.getElementById('wake-btn').onclick = toggleWakeLock;
    document.getElementById('sim-btn').onclick = toggleSim;
    document.getElementById('resnap-btn').onclick = () => {
      if (rawLat !== null) {
        const snap = snapToTrack(rawLat, rawLon, true);
        currentKm = snap.km;
        renderHUD();
      }
    };

    function setTab(t) {
      viewTab = t;
      document.getElementById('tab-ele').classList.toggle('active', t === 'ele');
      document.getElementById('tab-map').classList.toggle('active', t === 'map');
      document.getElementById('tab-both').classList.toggle('active', t === 'both');
      document.getElementById('ele-wrap').style.display = (t === 'ele' || t === 'both') ? 'block' : 'none';
      document.getElementById('map-wrap').style.display = (t === 'map' || t === 'both') ? 'block' : 'none';
      document.getElementById('zoom-btn').style.display = (t === 'map' || t === 'both') ? 'inline-flex' : 'none';
      renderMap();
    }
    document.getElementById('tab-ele').onclick = () => setTab('ele');
    document.getElementById('tab-map').onclick = () => setTab('map');
    document.getElementById('tab-both').onclick = () => setTab('both');
    document.getElementById('zoom-btn').onclick = () => {
      zoomMap = !zoomMap;
      document.getElementById('zoom-btn').textContent = zoomMap ? '🗺️ ดูทั้งเส้นทาง' : '🔍 ซูมรอบตัว';
      renderMap();
    };

    // Click on elevation chart to jump km
    document.getElementById('ele-svg').addEventListener('click', e => {
      stopSim();
      const rect = e.currentTarget.getBoundingClientRect();
      const relX = (e.clientX - rect.left) / rect.width * 640;
      const km = Math.max(0, Math.min(MAX_KM, ((relX - 34) / (640 - 44)) * MAX_KM));
      currentKm = km;
      renderHUD();
    });

    const stepKm = delta => {
      stopSim();
      currentKm = Math.max(0, Math.min(MAX_KM, currentKm + delta));
      document.getElementById('status-right').textContent = `${Math.round(currentKm / MAX_KM * 100)}%`;
      renderHUD();
    };
    document.getElementById('btn-m05').onclick = () => stepKm(-0.5);
    document.getElementById('btn-m01').onclick = () => stepKm(-0.1);
    document.getElementById('btn-p01').onclick = () => stepKm(0.1);
    document.getElementById('btn-p05').onclick = () => stepKm(0.5);
    document.getElementById('km-slider').oninput = e => {
      stopSim();
      currentKm = parseFloat(e.target.value);
      document.getElementById('status-right').textContent = `${Math.round(currentKm / MAX_KM * 100)}%`;
      renderHUD();
    };

    // Build quick pin chips
    const chipBar = document.getElementById('chip-bar');
    for (const q of QUICK_PINS) {
      const b = document.createElement('button');
      b.className = 'chip';
      b.textContent = q.label;
      b.onclick = () => {
        stopSim();
        currentKm = q.km;
        document.getElementById('status-right').textContent = `${Math.round(currentKm / MAX_KM * 100)}%`;
        renderHUD();
      };
      chipBar.appendChild(b);
    }

    window.addEventListener('themechange', renderHUD);
    renderHUD();
  </script>
</body>
</html>
